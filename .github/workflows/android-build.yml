name: Android Debug Build

# Runs the real Gradle build on GitHub's Ubuntu runners — this is the
# piece Termux cannot reliably do itself (AGP downloads a glibc/x86_64
# aapt2 binary that Termux's environment can't execute). Termux's job
# is only steps 1-4 in the report: npm install, npm run build,
# npx cap add/sync android, then push. This workflow picks up from
# there and produces a real, installable APK.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Build web assets
        run: npm run build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: math-engine-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
